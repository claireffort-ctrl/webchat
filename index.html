            border-style: solid; 
            border-color: #4c4c4c transparent transparent transparent;
        }
        
        #wx-action-menu.arrow-up::after {

<body>

    <!-- 伪装盖板 -->
    <div id="stealth-cover">
        <div id="secret-trigger"></div>
        <h1>404 Not Found</h1>
        <p>The requested URL was not found on this server.</p>
    </div>

    <!-- 左侧日历栏 -->
    <div id="sidebar">
        <h3>Recents</h3>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="🔍 搜索并回车..." onkeypress="handleSearch(event)">
        </div>
        
        <div id="vip-presence-area">
            <h4>🕵️ 秘密探测仪</h4>
            <div id="presence-list">加载中...</div>
        </div>

        <div id="date-list"></div>
    </div>

    <!-- 主界面 -->
    <!-- 更换为 handleChatScroll 以支持向下滑动加载 -->
    <div id="main-area" onclick="closeActionMenu()">
        <div id="header-container">
            <button id="toggle-btn" onclick="event.stopPropagation(); toggleSidebar();">☰</button>
            <h2 onclick="lockScreen()">blablaba</h2>
        </div>
        
        <div id="announcement-container" onclick="event.stopPropagation()">
            <div class="announcement-header" onclick="toggleAnnouncement(event)">
                <div><span class="icon" style="margin-right:5px; font-size: 11px;">▶</span> reminder</div>
                <button id="edit-announcement-btn" onclick="toggleEditAnnouncement(event)">编辑</button>
            </div>
            <div id="announcement-body" style="display: none;">
                <div id="announcement-content">加载中...</div>
                <textarea id="announcement-edit-area" placeholder="在这里写下新的 reminder..."></textarea>
                <button id="save-announcement-btn" onclick="saveAnnouncement()">保存</button>
            </div>
        </div>

        <div id="history-notice"></div>
        
        <!-- 加入滚动监听实现无限加载 -->
        <div id="chat-box" onscroll="handleChatScroll()">
            <div id="wx-action-menu" onclick="event.stopPropagation()">
                <div class="wx-action-item" onclick="doCopy()">复制</div>
                <div class="wx-action-item" onclick="doReply()">引用</div>
            </div>
        </div>
        
        <div id="reply-preview">
            <span id="reply-text-preview"></span>
            <span id="cancel-reply" onclick="cancelReply()">×</span>
        </div>

        <div id="input-area" onclick="event.stopPropagation()">
            <input type="text" id="user-name" placeholder="名字" oninput="resortChat()">
            <textarea id="msg-input" placeholder="输入你想说的话..." onkeydown="handleEnter(event)" onfocus="closeActionMenu()"></textarea>
            <button class="send-action" id="send-btn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        // --- 核心全局变量 ---
        let allActiveDatesSorted = []; 
        let earliestLoadedDate = "";
        let isLoadingHistory = false;

        // --- 防破解装甲 ---
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','i','J','j','C','c'].includes(e.key)) || (e.ctrlKey && ['U','u'].includes(e.key))) {
                e.preventDefault();
            }
        });
        setInterval(function() { try { (function() { return false; }['constructor']('debugger')()); } catch (err) {} }, 1000);

        // --- 锁屏逻辑 ---
        let tapCount = 0; 
        let tapTimer = null; 
        let idleTimer = null; 
        const IDLE_TIMEOUT = 10 * 60 * 1000;
        
        function lockScreen() { 
            document.getElementById('stealth-cover').style.display = 'flex'; 
            sessionStorage.removeItem('unlocked'); 
            tapCount = 0; 
        }
        
        function resetIdleTimer() { 
            clearTimeout(idleTimer); 
            if (sessionStorage.getItem('unlocked') === 'true') { 
                idleTimer = setTimeout(lockScreen, IDLE_TIMEOUT); 
            } 
        }
        
        let idleThrottle = false; 
        function throttledReset() { 
            if (idleThrottle) return; 
            idleThrottle = true; 
            resetIdleTimer(); 
            setTimeout(() => { idleThrottle = false; }, 2000); 
        }
        
        ['mousemove', 'mousedown', 'keypress', 'touchstart', 'scroll'].forEach(evt => { 
            document.addEventListener(evt, throttledReset, { passive: true }); 
        });
        
        document.getElementById('secret-trigger').addEventListener('click', function() {
            tapCount++; 
            clearTimeout(tapTimer);
            if (tapCount >= 3) { 
                document.getElementById('stealth-cover').style.display = 'none'; 
                sessionStorage.setItem('unlocked', 'true'); 
                resetIdleTimer(); 
            }
            tapTimer = setTimeout(() => { tapCount = 0; }, 500);
        });
        
        if (sessionStorage.getItem('unlocked') === 'true') { 
            document.getElementById('stealth-cover').style.display = 'none'; 
            resetIdleTimer(); 
        }
        
        document.addEventListener("visibilitychange", function() { if (document.hidden) lockScreen(); });

        // --- Firebase 配置 ---
        const firebaseConfig = {
            apiKey: "AIzaSyB0iOMZPM8CfJxLaeyXvdwfG_H5GMONCjc",
            authDomain: "blabalaba-69dc2.firebaseapp.com",
            databaseURL: "https://blabalaba-69dc2-default-rtdb.firebaseio.com",
            projectId: "blabalaba-69dc2",
            storageBucket: "blabalaba-69dc2.firebasestorage.app",
            messagingSenderId: "393868557271",
            appId: "1:393868557271:web:0b27791b67248bcf9de992"
        };
        firebase.initializeApp(firebaseConfig); 
        const db = firebase.database(); 
        const ROOM_PREFIX = "mads0330/";
        
        let lastDate = ""; 
        let currentView = "live"; 
        let currentReplyTarget = null; 
        let currentLiveDate = "";
        const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        window.onload = function() {
            const savedName = localStorage.getItem('chat_username');
            if (savedName) { 
                document.getElementById('user-name').value = savedName; 
                updatePresence(); 
            }
            checkVipStatus(); 
            monitorPresence(); 
            monitorAnnouncement(); 
            
            setTimeout(() => { loadSidebarDates(); }, 500); 
            
            if (!isMobileDevice) { 
                document.getElementById('msg-input').placeholder = "按 Enter 发送，Shift+Enter 换行..."; 
            } else { 
                document.getElementById('msg-input').placeholder = "输入你想说的话..."; 
            }
        };

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }

        // --- 公告板逻辑 ---
        function toggleAnnouncement(e) {
            if (e.target.tagName === 'BUTTON') return;
            const body = document.getElementById('announcement-body');
            const icon = document.querySelector('.announcement-header .icon');
            if (body.style.display === 'none' || body.style.display === '') {
                body.style.display = 'block'; 
                icon.innerText = '▼';
            } else {
                body.style.display = 'none'; 
                icon.innerText = '▶';
            }
        }

        function monitorAnnouncement() { 
            db.ref(ROOM_PREFIX + 'announcement').on('value', snapshot => { 
                document.getElementById('announcement-content').innerText = snapshot.val() || "暂时没有 reminder 记录。"; 
            }); 
        }

        function toggleEditAnnouncement(e) {
            if (e) e.stopPropagation(); 
            const body = document.getElementById('announcement-body');
            if (body.style.display === 'none' || body.style.display === '') { toggleAnnouncement({target: body}); }
            const contentDiv = document.getElementById('announcement-content'); 
            const editArea = document.getElementById('announcement-edit-area');
            const saveBtn = document.getElementById('save-announcement-btn'); 
            const editBtn = document.getElementById('edit-announcement-btn');
            
            if (editArea.style.display === 'none' || editArea.style.display === '') {
                contentDiv.style.display = 'none'; editArea.style.display = 'block'; 
                saveBtn.style.display = 'block'; editBtn.innerText = '取消';
                db.ref(ROOM_PREFIX + 'announcement').once('value').then(snap => { 
                    editArea.value = snap.val() || ""; editArea.focus(); 
                });
            } else {
                contentDiv.style.display = 'block'; editArea.style.display = 'none'; 
                saveBtn.style.display = 'none'; editBtn.innerText = '编辑';
            }
        }

        function saveAnnouncement() { 
            const text = document.getElementById('announcement-edit-area').value.trim();
            db.ref(ROOM_PREFIX + 'announcement').set(text).then(() => { toggleEditAnnouncement(); }); 
        }

        // --- 秘密探测仪 ---
        function updatePresence() {
            const name = document.getElementById('user-name').value.trim();
            if (name) { 
                const now = new Date(); 
                db.ref(ROOM_PREFIX + 'presence/' + name).set({ 
                    timeStr: now.toLocaleDateString() + " " + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), 
                    timestamp: now.getTime() 
                }); 
            }
        }

        function checkVipStatus() { 
            const name = document.getElementById('user-name').value.trim();
            if (name === "me") { document.getElementById('vip-presence-area').style.display = 'block'; } 
            else { document.getElementById('vip-presence-area').style.display = 'none'; }
        }

        function monitorPresence() {
            db.ref(ROOM_PREFIX + 'presence').on('value', snapshot => {
                const listDiv = document.getElementById('presence-list'); 
                listDiv.innerHTML = ""; let activeCount = 0; const nowMs = new Date().getTime();
                if (snapshot.exists()) {
                    snapshot.forEach(child => {
                        const userName = child.key; const data = child.val();
                        let lastTimeStr = ""; let lastTimestamp = 0;
                        if (typeof data === 'string') { lastTimeStr = data; lastTimestamp = new Date(data.replace(/年|月/g, '/').replace(/日/g, '')).getTime(); } 
                        else if (data && data.timestamp) { lastTimeStr = data.timeStr; lastTimestamp = data.timestamp; }
                        
                        if(userName !== "me" && !isNaN(lastTimestamp) && (nowMs - lastTimestamp) <= 86400000) {
                            const div = document.createElement('div'); div.innerText = `👤 ${userName}: ${lastTimeStr}`; 
                            listDiv.appendChild(div); activeCount++;
                        }
                    });
                }
                if (activeCount === 0) { listDiv.innerHTML = "<div style='color:#aaa; font-style:italic;'>24小时内暂无活跃记录</div>"; }
            });
        }

        let typingTimer;
        function resortChat() { 
            clearTimeout(typingTimer); 
            typingTimer = setTimeout(() => { 
                localStorage.setItem('chat_username', document.getElementById('user-name').value.trim()); 
                checkVipStatus(); updatePresence(); 
                if (currentView === "live") { loadLiveChat(); }
            }, 500); 
        }

        function loadSidebarDates() {
            db.ref(ROOM_PREFIX + 'active_dates').once('value').then(snapshot => {
                if (snapshot.exists()) {
                    const dates = new Set(); 
                    snapshot.forEach(child => dates.add(child.key));
                    
                    // 全局记录所有日期并排序，为无缝向上翻页做准备
                    allActiveDatesSorted = Array.from(dates).sort((a, b) => new Date(a.replace(/-/g, '/')).getTime() - new Date(b.replace(/-/g, '/')).getTime());
                    
                    db.ref(ROOM_PREFIX + 'messages').limitToFirst(1).once('value', oldSnap => {
                        if (oldSnap.exists()) { migrateOldMessages(dates); } 
                        else { renderSidebarUI(dates); loadLiveChat(); }
                    });
                } else { migrateOldMessages(new Set()); }
            });
        }

        function migrateOldMessages(datesSet) {
            db.ref(ROOM_PREFIX + 'messages').once('value', snap => {
                let updates = {}; let count = 0;
                snap.forEach(child => {
                    let v = child.val();
                    if (v && v.date && typeof v === 'object') {
                        let safeDate = v.date.replace(/[\/\.]/g, '-'); v.date = safeDate; 
                        updates['daily_messages/' + safeDate + '/' + child.key] = v;
                        updates['active_dates/' + safeDate] = safeDate;
                        datesSet.add(safeDate); count++;
                    }
                });
                if (count > 0) {
                    updates['messages'] = null; 
                    db.ref(ROOM_PREFIX).update(updates).then(() => {
                        allActiveDatesSorted = Array.from(datesSet).sort((a, b) => new Date(a.replace(/-/g, '/')).getTime() - new Date(b.replace(/-/g, '/')).getTime());
                        renderSidebarUI(datesSet); loadLiveChat();
                    });
                } else { renderSidebarUI(datesSet); loadLiveChat(); }
            });
        }

        function renderSidebarUI(dates) {
            const dateListDiv = document.getElementById('date-list');
            dateListDiv.innerHTML = '<div class="history-item active" id="live-chat-btn" onclick="loadLiveChat()" style="padding-left:20px;">🔴 返回最新聊天</div>';
            const groupedDates = {};
            const sortedDates = Array.from(dates).sort((a, b) => new Date(b.replace(/-/g, '/')).getTime() - new Date(a.replace(/-/g, '/')).getTime());
            
            sortedDates.forEach(dateStr => {
                const d = new Date(dateStr.replace(/-/g, '/')); 
                let monthGroup = !isNaN(d.getTime()) ? d.getFullYear() + "年" + (d.getMonth() + 1) + "月" : "未知记录";
                if (!groupedDates[monthGroup]) { groupedDates[monthGroup] = []; }
                groupedDates[monthGroup].push(dateStr);
            });
            
            for (const month in groupedDates) {
                const header = document.createElement('div'); header.className = 'month-header'; 
                header.innerHTML = `<span>${month}</span><span class="icon">▶</span>`;
                const content = document.createElement('div'); content.className = 'month-content'; 
                header.onclick = () => { 
                    const isOpen = content.classList.contains('open'); content.classList.toggle('open'); 
                    header.querySelector('.icon').innerText = isOpen ? '▶' : '▼'; 
                };
                dateListDiv.appendChild(header); dateListDiv.appendChild(content);
                
                groupedDates[month].forEach(dateStr => {
                    const div = document.createElement('div'); div.className = 'history-item'; 
                    div.innerText = "📅 " + dateStr; div.dataset.date = dateStr; 
                    div.onclick = () => { 
                        loadHistory(dateStr, div); 
                        if(window.innerWidth <= 600) { toggleSidebar(); }
                    }; 
                    content.appendChild(div);
                });
            }
        }

        // --- 核心：滑动监听与向上翻页 ---
        function handleChatScroll() {
            closeActionMenu();
            const chatBox = document.getElementById('chat-box');
            // 当滚动条触碰到顶部（允许5px的移动缓冲误差）时，加载更早记录
            if (chatBox.scrollTop <= 5 && !isLoadingHistory && currentView !== "search") {
                loadOlderMessages();
            }
        }

        function loadOlderMessages() {
            if (!earliestLoadedDate || allActiveDatesSorted.length === 0) return;
            
            // 找出比目前屏幕上“最早那一天”还要早一天的日期
            const currentIndex = allActiveDatesSorted.indexOf(earliestLoadedDate);
            if (currentIndex > 0) { 
                const previousDate = allActiveDatesSorted[currentIndex - 1]; 
                if (previousDate) {
                    isLoadingHistory = true;
                    const chatBox = document.getElementById('chat-box');
                    
                    const loadingIndicator = document.createElement('div');
                    loadingIndicator.innerText = "⏳ 正在翻阅更早的记录...";
                    loadingIndicator.style.textAlign = "center";
                    loadingIndicator.style.color = "#888";
                    loadingIndicator.style.fontSize = "12px";
                    loadingIndicator.style.padding = "15px 0";
                    chatBox.insertBefore(loadingIndicator, chatBox.firstChild);

                    db.ref(ROOM_PREFIX + 'daily_messages/' + previousDate).once('value', snapshot => {
                        const oldScrollHeight = chatBox.scrollHeight;
                        chatBox.removeChild(loadingIndicator);

                        if (snapshot.exists()) {
                            const fragment = document.createDocumentFragment();
                            
                            // 加上前一天的日期分割线
                            const dateDiv = document.createElement('div'); 
                            dateDiv.className = 'date-divider'; 
                            dateDiv.innerText = `--- ${previousDate} ---`; 
                            fragment.appendChild(dateDiv);

                            snapshot.forEach(child => {
                                // 避免重复加载
                                if (!document.getElementById('msg-' + child.key)) {
                                    fragment.appendChild(createMessageNode(child.val(), child.key));
                                }
                            });
                            
                            // 拼接到聊天框的最上面
                            chatBox.insertBefore(fragment, chatBox.firstChild);
                            earliestLoadedDate = previousDate;
                            
                            // 巧妙调整滚动条位置，使得画面停留在刚拉下来的位置，不会乱跳
                            const newScrollHeight = chatBox.scrollHeight;
                            chatBox.scrollTop = newScrollHeight - oldScrollHeight;
                        }
                        isLoadingHistory = false;
                    });
                }
            }
        }

        // --- 提取：纯净的气泡生成器（为了向上拼装复用） ---
        function createMessageNode(data, msgKey) {
            const msgDiv = document.createElement('div'); 
            msgDiv.className = 'message'; 
            msgDiv.id = 'msg-' + msgKey; 
            
            const currentMyName = document.getElementById('user-name').value.trim();
            if ((data.name || "").trim() === currentMyName && currentMyName !== "") { 
                msgDiv.classList.add('mine'); 
            } else { 
                msgDiv.classList.add('other'); 
            }
            
            let quoteHtml = '';
            if (data.reply) {
                if (data.reply.date && data.reply.msgKey) {
                    quoteHtml = `<div class="quote-block" style="cursor: pointer;" onclick="event.stopPropagation(); jumpToContext('${data.reply.date}', '${data.reply.msgKey}')" title="点击定位到原消息"><b>${data.reply.name}：</b>${data.reply.text}</div>`;
                } else {
                    quoteHtml = `<div class="quote-block"><b>${data.reply.name}：</b>${data.reply.text}</div>`;
                }
            }
            
            let processedText = data.text;
            const imgRegex = /(https?:\/\/[^\s]+?\.(?:jpg|jpeg|png|gif|webp))/gi;
            if (imgRegex.test(processedText)) {
                processedText = processedText.replace(imgRegex, '<img src="$1" style="max-width: 100%; max-height: 300px; border-radius: 8px; margin-top: 5px; display: block;">');
            }

            msgDiv.innerHTML = quoteHtml + `<div class="meta"><span>${data.name} &nbsp; ${data.time}</span></div>` + processedText;

            let pressTimer;
            const startPress = (e) => {
                e.stopPropagation();
                pressTimer = setTimeout(() => { 
                    showActionMenu(data, msgKey, msgDiv); 
                    if (navigator.vibrate) { navigator.vibrate(50); }
                }, 500); 
            };
            
            const cancelPress = () => { clearTimeout(pressTimer); };

            msgDiv.addEventListener('touchstart', startPress, {passive: true});
            msgDiv.addEventListener('touchend', cancelPress);
            msgDiv.addEventListener('touchmove', cancelPress);
            msgDiv.addEventListener('mousedown', startPress);
            msgDiv.addEventListener('mouseup', cancelPress);
            msgDiv.addEventListener('mouseleave', cancelPress);

            return msgDiv;
        }

        // --- 微信风长按逻辑 ---
        let activeMessageForAction = null;
        let activeMsgElement = null;

        function showActionMenu(data, msgKey, msgElement) {
            closeActionMenu(); 
            activeMessageForAction = { 
                name: data.name || "未知", 
                text: data.text || "",
                date: data.date || "",
                msgKey: msgKey 
            };
            activeMsgElement = msgElement;
            msgElement.classList.add('active-long-press'); 

            const menu = document.getElementById('wx-action-menu');
            const chatBox = document.getElementById('chat-box');
            
            menu.style.display = 'block'; menu.classList.remove('arrow-up');
            
            let topPos = msgElement.offsetTop - menu.offsetHeight - 10;
            let leftPos = msgElement.offsetLeft + (msgElement.offsetWidth / 2) - (menu.offsetWidth / 2);

            if (topPos < chatBox.scrollTop) {
                topPos = msgElement.offsetTop + msgElement.offsetHeight + 10;
                menu.classList.add('arrow-up');
            }
            
            if (leftPos < 10) { leftPos = 10; }
            if (leftPos + menu.offsetWidth > chatBox.clientWidth - 10) { leftPos = chatBox.clientWidth - menu.offsetWidth - 10; }

            menu.style.top = topPos + 'px'; menu.style.left = leftPos + 'px';
        }

        function closeActionMenu() {
            document.getElementById('wx-action-menu').style.display = 'none';
            if (activeMsgElement) { activeMsgElement.classList.remove('active-long-press'); }
            activeMessageForAction = null; activeMsgElement = null;
        }

        function doCopy() {
            if (!activeMessageForAction) return;
            const textArea = document.createElement("textarea"); 
            textArea.value = activeMessageForAction.text;
            document.body.appendChild(textArea); textArea.select();
            try { document.execCommand("Copy"); } catch (err) {} 
            textArea.remove(); closeActionMenu();
        }

        function doReply() {
            if (!activeMessageForAction) return;
            const targetName = activeMessageForAction.name || "未知";
            const rawText = activeMessageForAction.text || "";
            const safeText = rawText.replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, ' ');
            const targetDate = activeMessageForAction.date;
            const targetMsgKey = activeMessageForAction.msgKey;
            
            closeActionMenu();
            initiateReply(targetName, safeText, targetDate, targetMsgKey);
        }

        function initiateReply(name, text, targetDate, targetMsgKey) {
            currentReplyTarget = { name: name, text: text, date: targetDate, msgKey: targetMsgKey };
            document.getElementById('reply-preview').style.display = 'block';
            document.getElementById('reply-text-preview').innerText = `回复 ${name}: ${text}`;
            document.getElementById('msg-input').focus();
        }

        function cancelReply() {
            currentReplyTarget = null;
            document.getElementById('reply-preview').style.display = 'none';
        }

        // --- 渲染最新/向下加载的聊天气泡 ---
        function renderMessage(data, msgKey) {
            const chatBox = document.getElementById('chat-box');
            
            // 为了安全起见，防止 Firebase 重复抛出节点
            if (document.getElementById('msg-' + msgKey)) return;

            if (data.date !== lastDate) {
                const dateDiv = document.createElement('div'); 
                dateDiv.className = 'date-divider'; 
                dateDiv.innerText = `--- ${data.date} ---`; 
                chatBox.appendChild(dateDiv); 
                lastDate = data.date;
            }
            
            const msgDiv = createMessageNode(data, msgKey);
            
            // 检查你目前是否在聊天框的最底部（差值小于 200 像素就算在底部）
            const isNearBottom = chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight < 200;

            chatBox.appendChild(msgDiv);
            
            // 优化：只有当你在看最新消息，或者刚进来的那一刻，才会滚到底部。
            // 如果你此时已经往上滑去回顾历史了，就不会强行把你拽下来！
            if (isNearBottom || (currentView === "history" && !document.querySelector('.highlight-target'))) {
                chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'instant' });
            }
            
            // 注意：扫地机器人代码已经被彻底删除，历史记录不再会被限制删除。
        }

        // --- 搜索功能 ---
        function handleSearch(e) {
            if (e.key === 'Enter') {
                const keyword = document.getElementById('search-input').value.trim(); 
                if (!keyword) { loadLiveChat(); return; }
                
                currentView = "search"; lastDate = ""; 
                const chatBox = document.getElementById('chat-box');
                Array.from(chatBox.children).forEach(child => { if(child.id !== 'wx-action-menu') { child.remove(); } });
                
                const notice = document.getElementById('history-notice'); 
                notice.innerText = `「搜索模式」: ${keyword}。在此处发送新消息，将自动带您回到最新聊天。`; 
                notice.style.display = 'block';
                document.querySelectorAll('.history-item').forEach(el => { el.classList.remove('active'); });

                db.ref(ROOM_PREFIX + 'daily_messages').once('value', snapshot => {
                    let foundCount = 0;
                    if (snapshot.exists()) { 
                        snapshot.forEach(daySnap => {
                            daySnap.forEach(msgSnap => {
                                const data = msgSnap.val();
                                if (data.text && data.text.includes(keyword)) { 
                                    const msgDiv = document.createElement('div'); 
                                    msgDiv.className = 'message search-result-card';
                                    msgDiv.innerHTML = `<div class="meta">📅 ${data.date} &nbsp;|&nbsp; 👤 ${data.name} &nbsp;|&nbsp; 🕒 ${data.time}</div><div style="margin: 8px 0; color:#333;">${data.text}</div><div style="font-size:12px; color:#1890ff; font-weight:bold;">👉 点击前往上下文定位</div>`;
                                    msgDiv.onclick = () => { jumpToContext(data.date, msgSnap.key); };
                                    chatBox.appendChild(msgDiv); foundCount++; 
                                }
                            });
                        }); 
                    }
                    if (foundCount === 0) {
                        chatBox.insertAdjacentHTML('beforeend', `<div style="text-align:center; color:#888; margin-top:30px;">没有找到关于 "${keyword}" 的记录哦~</div>`);
                    }
                });
                if(window.innerWidth <= 600) { toggleSidebar(); }
            }
        }

        function jumpToContext(dateStr, msgKey) {
            let targetEl = null;
            document.querySelectorAll('.history-item').forEach(el => {
                if (el.dataset.date === dateStr) { 
                    targetEl = el; 
                    const parentContent = el.closest('.month-content'); 
                    if (parentContent && !parentContent.classList.contains('open')) { 
                        parentContent.classList.add('open'); 
                        parentContent.previousElementSibling.querySelector('.icon').innerText = '▼'; 
                    } 
                }
            });
            loadHistory(dateStr, targetEl, msgKey);
        }

        // --- 加载最新聊天 ---
        function loadLiveChat() {
            currentView = "live"; lastDate = ""; closeActionMenu();
            const chatBox = document.getElementById('chat-box'); 
            Array.from(chatBox.children).forEach(child => { if(child.id !== 'wx-action-menu') { child.remove(); } });
            
            document.getElementById('search-input').value = ""; 
            document.getElementById('history-notice').style.display = 'none';
            document.querySelectorAll('.history-item').forEach(el => { el.classList.remove('active'); });
            
            const liveBtn = document.getElementById('live-chat-btn'); 
            if (liveBtn) { liveBtn.classList.add('active'); }
            
            const todaySafe = new Date().toLocaleDateString().replace(/[\/\.]/g, '-');
            
            db.ref(ROOM_PREFIX + 'active_dates').once('value', snap => {
                let targetDate = todaySafe;
                if (snap.exists()) {
                    let allDates = [];
                    snap.forEach(child => { allDates.push(child.key); });
                    allActiveDatesSorted = allDates.sort((a, b) => new Date(a.replace(/-/g, '/')).getTime() - new Date(b.replace(/-/g, '/')).getTime());
                    if (allActiveDatesSorted.length > 0) {
                        targetDate = allActiveDatesSorted[allActiveDatesSorted.length - 1]; 
                    }
                }
                
                earliestLoadedDate = targetDate; // 标记当前第一层的底座日期
                
                // 去掉了之前的 .limitToLast(50) 限制，直接给你加载全部！
                if (targetDate !== todaySafe) {
                    db.ref(ROOM_PREFIX + 'daily_messages/' + targetDate).once('value', oldSnap => {
                        oldSnap.forEach(child => { renderMessage(child.val(), child.key); });
                        setupLiveListener(todaySafe);
                    });
                } else {
                    setupLiveListener(targetDate);
                }
            });
            
            if(window.innerWidth <= 600) { document.getElementById('sidebar').classList.add('collapsed'); }
        }

        function setupLiveListener(dateStr) {
            currentLiveDate = dateStr;
            db.ref(ROOM_PREFIX + 'daily_messages/' + dateStr).off();
            // 去掉限制，让你能直接在这个池子里滚动查看这一天的全部
            db.ref(ROOM_PREFIX + 'daily_messages/' + dateStr).on('child_added', snapshot => { 
                renderMessage(snapshot.val(), snapshot.key); 
            });
        }

        // --- 加载历史抽屉 ---
        function loadHistory(dateStr, element, jumpMsgKey = null) {
            currentView = "history"; lastDate = ""; closeActionMenu();
            const chatBox = document.getElementById('chat-box'); 
            Array.from(chatBox.children).forEach(child => { if(child.id !== 'wx-action-menu') { child.remove(); } });
            
            document.getElementById('search-input').value = ""; 
            const notice = document.getElementById('history-notice'); 
            notice.innerText = "当前为「历史记录」模式。在此发送新消息或引用回复，将自动带您回到最新聊天。"; 
            notice.style.display = 'block';
            document.querySelectorAll('.history-item').forEach(el => { el.classList.remove('active'); }); 
            if (element) { element.classList.add('active'); }

            earliestLoadedDate = dateStr; // 标记这是目前最上面的日期，之后可以继续往上翻

            db.ref(ROOM_PREFIX + 'daily_messages/' + dateStr).once('value', snapshot => {
                if (snapshot.exists()) { 
                    snapshot.forEach(child => { renderMessage(child.val(), child.key); }); 
                    if (jumpMsgKey) { 
                        setTimeout(() => { 
                            const targetMsg = document.getElementById('msg-' + jumpMsgKey); 
                            if (targetMsg) { 
                                targetMsg.scrollIntoView({ behavior: 'smooth', block: 'center' }); 
                                targetMsg.classList.add('highlight-target'); 
                            } 
                        }, 100); 
                    }
                }
            });
        }

        // --- 发送消息 ---
        function sendMessage() {
            const name = document.getElementById('user-name').value.trim(); 
            const text = document.getElementById('msg-input').value.trim();
            if (!text || !name) { alert("名字和消息都不能为空哦！"); return; }

            if (text.includes("data:image/") && text.length > 500) {
                alert("⚠️ 警告：请不要直接粘贴图片！\n\n为了节省宝贵的数据库空间，请先将图片上传到外部免费图床（如 Postimages），然后再把直接链接粘贴过来。");
                document.getElementById('msg-input').value = ""; return; 
            }

            localStorage.setItem('chat_username', name); updatePresence(); 
            const now = new Date(); const safeDate = now.toLocaleDateString().replace(/[\/\.]/g, '-');
            
            const payload = { 
                name: name, text: text, date: safeDate, 
                time: now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) 
            };
            if (currentReplyTarget) { payload.reply = currentReplyTarget; }

            if (currentView === "live" && currentLiveDate !== safeDate) {
                db.ref(ROOM_PREFIX + 'daily_messages/' + currentLiveDate).off();
                setupLiveListener(safeDate);
            }

            db.ref(ROOM_PREFIX + 'daily_messages/' + safeDate).push(payload).then(() => { 
                cancelReply(); 
                db.ref(ROOM_PREFIX + 'active_dates/' + safeDate).set(safeDate);
                if (currentView !== "live") { loadLiveChat(); }
            });
            document.getElementById('msg-input').value = ""; document.getElementById('msg-input').focus();
        }

        function handleEnter(e) { 
            if (e.isComposing || e.keyCode === 229) { return; }
            if (e.key === 'Enter') { 
                if (isMobileDevice) { return; }
                if (!e.shiftKey) { e.preventDefault(); sendMessage(); } 
            }
        }
    </script>
</body>
</html>
